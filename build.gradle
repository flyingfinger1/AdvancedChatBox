plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def javaVersion = JavaVersion.toVersion(project.javaVersion)

repositories {
    // Our refurbished AdvancedChatCore, published locally with `publishToMavenLocal`.
    mavenLocal()
    mavenCentral()
    maven { name = 'FabricMC'; url = 'https://maven.fabricmc.net/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { name = 'JitPack'; url = 'https://jitpack.io' }
}

dependencies {
    // 26.x ships unobfuscated — no Yarn/Mojang mappings, Loom does not remap.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "maven.modrinth:malilib:${project.malilib_version}"

    // AdvancedChatCore (our refurbished fork, from mavenLocal)
    implementation "io.github.darkkronicle:AdvancedChatCore:${project.advancedchat_version}"

    // Calculator suggestor
    implementation "org.mariuszgromada.math:MathParser.org-mXparser:${project.mxparser_version}"

    // Spell-check ENGINE only (LanguageTool core). The actual language data (English, German, ...) is
    // large and lives in separate add-on mods (advancedchatbox-lang-*) that bundle their own
    // language-XX artifact and register a SpellCheckLanguageProvider via the "advancedchatbox:spellcheck"
    // entrypoint. Box compiles and runs against core only.
    implementation "org.languagetool:languagetool-core:5.5"
    include "org.languagetool:languagetool-core:5.5"
    // Hunspell spell-check backend (used by some languages, e.g. German; English uses morfologik). This
    // is engine-level (part of languagetool-core's spelling support), so it lives in Box. Pulls the
    // native BridJ binding (org.bridj.Pointer).
    include "com.gitlab.dumonts:hunspell:1.1.1"
    include "com.nativelibs4java:bridj:0.7.0"
    include group: 'net.loomchild', name: 'segment', version: '2.0.3'
    // segment's SRX parser needs Apache Commons Logging at runtime; not bundled before -> crash.
    implementation "commons-logging:commons-logging:1.2"
    include "commons-logging:commons-logging:1.2"
    include group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'
    include group: 'net.sf.trove4j', name: 'trove4j', version: '3.0.3'
    include group: 'org.jetbrains.intellij.deps', name: 'trove4j', version: '1.0.20200330'
    include group: 'javax.measure', name: 'unit-api', version: '2.1.3'
    include group: 'tech.units', name: 'indriya', version: '1.3'
    include group: 'tech.uom.lib', name: 'uom-lib-common', version: '1.1'
    include group: 'org.carrot2', name: 'morfologik-fsa', version: '2.1.7'
    include group: 'org.carrot2', name: 'morfologik-fsa-builders', version: '2.1.7'
    include group: 'org.carrot2', name: 'morfologik-speller', version: '2.1.7'
    include group: 'org.carrot2', name: 'morfologik-stemming', version: '2.1.7'
    // opennlp (English POS/chunk/tokenize models, ~9 MB) is English-specific — German uses its own
    // morfologik tagger — so it lives in the English language add-on, not here. hppc stays (morfologik
    // uses it).
    include group: 'com.carrotsearch', name: 'hppc', version: '0.9.0'

    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = Integer.parseInt(project.javaVersion)
}

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    withSourcesJar()
}

jar {
    from 'LICENSE.txt'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
